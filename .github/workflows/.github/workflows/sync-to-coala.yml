# neetcode-submissions 레포의 .github/workflows/sync-to-coala.yml 로 저장

name: Sync NeetCode to coala-study/coding-test

on:
  push:
    branches: [main]   # 이 레포 기본 브랜치명. 스크린샷에서 main 맞음

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: neetcode 풀이 레포 체크아웃
        uses: actions/checkout@v4
        with:
          path: source

      - name: coala-study/coding-test 체크아웃
        uses: actions/checkout@v4
        with:
          repository: coala-study/coding-test
          token: ${{ secrets.COALA_SYNC_TOKEN }}
          path: target

      - name: seungseok/neetcode 폴더로 복사
        run: |
          rm -rf target/seungseok/neetcode
          mkdir -p target/seungseok/neetcode
          rsync -a --exclude='.git' --exclude='.github' source/ target/seungseok/neetcode/

      - name: 커밋 & 푸시
        run: |
          cd target
          git config user.name "tmdtjr"
          git config user.email "202040921+tmdtjr@users.noreply.github.com"
          git add seungseok/neetcode
          git diff --staged --quiet || git commit -m "sync: update seungseok neetcode solutions"
          git push
